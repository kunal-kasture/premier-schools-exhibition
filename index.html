<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premier Schools Exhibition (PSE)</title>
    <link
      href="https://googleapis.com/css2?family=Open+Sans:wght@700&display=swap"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header class="header" id="header">
      <div
        class="header__container"
        aria-label="Premier Schools Exhibition Home"
      >
        <img
          src="./assets/logo.svg"
          alt="Premier Schools Exhibition Logo"
          class="header__logo-img"
        />

        <nav class="header__nav" aria-label="Main Navigation">
          <button class="register-btn">
            <div class="btn-content">
              <div class="bg-slider"></div>
              <div class="icon-box">
                <div class="arrow-container">
                  <img src="./assets/arrow.svg" alt="arrow" />
                </div>
              </div>
              <div class="text-box">Register Now</div>
            </div>
          </button>
        </nav>
      </div>
    </header>
  </body>
</html>
