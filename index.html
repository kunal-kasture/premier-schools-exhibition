<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premier Schools Exhibition (PSE)</title>
    <link
      href="https://googleapis.com/css2?family=Open+Sans:wght@700&display=swap"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- Sticky header with brand logo and register button -->
    <header class="header" id="header">
      <div
        class="header__container"
        aria-label="Premier Schools Exhibition Home"
      >
        <!-- Logo -->
        <img
          src="./assets/logo.svg"
          alt="Premier Schools Exhibition Logo"
          class="header__logo-img"
        />
        <!-- Register Button -->
        <nav class="header__nav" aria-label="Main Navigation">
          <button class="register-btn">
            <div class="btn-content">
              <div class="bg-slider"></div>
              <div class="icon-box">
                <div class="arrow-container">
                  <img src="./assets/arrow.svg" alt="arrow" />
                </div>
              </div>
              <div class="text-box">Register Now</div>
            </div>
          </button>
        </nav>
      </div>
    </header>

    <!-- Hero landing: headline, animated capsule columns, and enquiry form -->
    <main id="main-content">
      <section class="hero" aria-label="Featured Schools and Events">
        <div class="hero__container">
          <!-- Left column: headline + auto-scrolling capsule columns -->
          <div
            class="hero__slider"
            id="hero-slider"
            role="region"
            aria-roledescription="carousel"
            aria-label="Highlighted Events"
          >
            <div class="hero__slides" id="hero-slides">
              <article
                class="hero__slide is-active"
                role="group"
                aria-roledescription="slide"
                aria-label="1 of 1"
              >
                <div class="hero__content">
                  <h1 class="hero__title">
                    <span style="font-size: 40px">Discover Gurugram's</span>
                    <br />
                    <span style="font-size: 50px">Top 30+ schools</span>
                    <span class="hero__subtitle" style="font-size: 30px"
                      >ALL IN ONE PLACE</span
                    >
                    <br />
                  </h1>
                  <div>
                    <img
                      src="./assets/schedule.svg"
                      alt="Schedule"
                      class="hero__schedule"
                    />
                  </div>
                </div>

                <!-- Media Grid / Column Slider -->
                <div class="hero__media-grid" aria-hidden="true">
                  <!-- Column 1 -->
                  <div class="hero__capsule-col">
                    <div class="hero__capsule-track">
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student1.svg"
                          alt="girl with specs is reading a book"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student4.svg"
                          alt="girl with bag smiling"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student7.svg"
                          alt="girl smiling sitting on chair with bunch of books, pen and a cup"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student10.svg"
                          alt="girl is running with paper pinwheel"
                        />
                      </div>

                      <!-- Duplicated cards so the column loops seamlessly -->
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student1.svg"
                          alt="girl with specs is reading a book"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student4.svg"
                          alt="girl with bag smiling"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student7.svg"
                          alt="girl smiling sitting on chair with bunch of books, pen and a cup"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student10.svg"
                          alt="girl is running with paper pinwheel"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Column 2 -->
                  <div class="hero__capsule-col hero__capsule-col--offset">
                    <div class="hero__capsule-track">
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student2.svg"
                          alt="3 little girls walking the path holding hands and laughing"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student5.svg"
                          alt="girl riding a toy while smiling"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student8.svg"
                          alt="girl with bag is holding a book with a smile"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student11.svg"
                          alt="a boy is holding a bat like he is about hit the ball"
                        />
                      </div>

                      <!-- Duplicated cards so the column loops seamlessly -->
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student2.svg"
                          alt="3 little girls walking the path holding hands and laughing"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student5.svg"
                          alt="girl riding a toy while smiling"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student8.svg"
                          alt="girl with bag is holding a book with a smile"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student11.svg"
                          alt="a boy is holding a bat like he is about hit the ball"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Column 3 -->
                  <div class="hero__capsule-col">
                    <div class="hero__capsule-track">
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student3.svg"
                          alt="boy is is playing football"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student6.svg"
                          alt="girl playing golf"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student9.svg"
                          alt="girl is siting while holding the cycle and its peddal with other hand"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student12.svg"
                          alt="2 boys together looking at microscope one is holding it and otehr watching it besides him"
                        />
                      </div>

                      <!-- Duplicated cards so the column loops seamlessly -->
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student3.svg"
                          alt="boy is is playing football"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student6.svg"
                          alt="girl playing golf"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student9.svg"
                          alt="girl is siting while holding the cycle and its peddal with other hand"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student12.svg"
                          alt="2 boys together looking at microscope one is holding it and otehr watching it besides him"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </article>
            </div>
          </div>

          <!-- Right column: enquiry form card -->
          <div class="hero__form-card" id="register">
            <h2 class="hero__form-title" id="enquiry-form-heading">
              Enquire Now
            </h2>
            <form class="enquiry-form" aria-labelledby="enquiry-form-heading">
              <div class="form-group">
                <label for="parent-name" class="visually-hidden"
                  >Parent's Name</label
                >
                <input
                  type="text"
                  id="parent-name"
                  name="parent-name"
                  class="form-control"
                  placeholder="Parent's Name"
                  required
                />
              </div>

              <div class="form-group">
                <label for="phone" class="visually-hidden">Phone number</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="form-control"
                  placeholder="Phone number"
                  required
                />
              </div>

              <div class="form-group">
                <label for="grade" class="visually-hidden"
                  >Which grade are you looking for?</label
                >
                <textarea
                  type="textarea"
                  id="grade"
                  name="grade"
                  class="form-control"
                  placeholder="Which grade are you looking for?"
                ></textarea>
              </div>

              <button class="submit-btn">
                <div class="submit-btn-content">
                  <div class="submit-btn-bg-slider"></div>
                  <div class="submit-btn-icon-box">
                    <div class="submit-btn-arrow-container">
                      <img src="./assets/arrow2.svg" alt="" />
                    </div>
                  </div>
                  <div class="submit-btn-text-box">SUBMIT</div>
                </div>
              </button>
            </form>
          </div>
        </div>
      </section>
      <section2>
        <div class="achivements">
          <img src="./assets/achievement1.svg" alt="Trusted by 1 Million+" />
          <img src="./assets/achievement2.svg" alt="22+ Years of Legacy" />
          <img
            src="./assets/achievement3.svg"
            alt="500+ Participating Schools"
          />
          <img
            src="./assets/achievement4.svg"
            alt="17 Cities Across the Globe"
          />
        </div>
      </section2>
    </main>
  </body>
</html>
