<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premier Schools Exhibition (PSE)</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- Skip link for keyboard users -->
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Header -->
    <header class="header" id="header">
      <div class="header__container">
        <img
          src="./assets/logo.svg"
          alt="Premier Schools Exhibition Logo"
          class="header__logo-img"
        />
        <nav class="header__nav" aria-label="Main Navigation">
          <button class="register-btn" type="button" aria-label="Register Now">
            <span class="register-btn__content">
              <span class="register-btn__bg-slider"></span>
              <span class="register-btn__icon-box">
                <span class="register-btn__arrow">
                  <img src="./assets/arrow.svg" alt="arrow" />
                </span>
              </span>
              <span class="register-btn__text">Register Now</span>
            </span>
          </button>
        </nav>
      </div>
    </header>

    <!-- Hero -->
    <main id="main-content" tabindex="-1">
      <section class="hero" aria-label="Featured Schools and Events">
        <div class="hero__container">
          <div
            class="hero__slider"
            id="hero-slider"
            role="region"
            aria-roledescription="carousel"
            aria-label="Highlighted Events"
            tabindex="0"
          >
            <div class="hero__slides" id="hero-slides">
              <div
                class="hero__slide is-active"
                role="group"
                aria-roledescription="slide"
                aria-label="1 of 1"
              >
                <div class="hero__content">
                  <h1 class="hero__title">
                    <span style="font-size: var(--hero-title-lg, 40px)"
                      >Discover Gurugram's</span
                    >
                    <br />
                    <span style="font-size: var(--hero-title-xl, 50px)"
                      >Top 30+ schools</span
                    >
                    <br />
                    <span
                      class="hero__subtitle"
                      style="font-size: var(--hero-title-sm, 30px)"
                      >ALL IN ONE PLACE</span
                    >
                  </h1>
                  <div>
                    <img
                      src="./assets/schedule.svg"
                      alt="Schedule"
                      class="hero__schedule"
                    />
                  </div>
                </div>

                <div class="hero__media-grid" aria-hidden="true">
                  <!-- Column 1 -->
                  <div class="hero__capsule-col">
                    <div class="hero__capsule-track">
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student1.svg"
                          alt="girl with specs is reading a book"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student4.svg"
                          alt="girl with bag smiling"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student7.svg"
                          alt="girl smiling sitting on chair with bunch of books, pen and a cup"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student10.svg"
                          alt="girl is running with paper pinwheel"
                        />
                      </div>

                      <!-- Duplicate cards for a seamless loop -->
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student1.svg"
                          alt="girl with specs is reading a book"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student4.svg"
                          alt="girl with bag smiling"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student7.svg"
                          alt="girl smiling sitting on chair with bunch of books, pen and a cup"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student10.svg"
                          alt="girl is running with paper pinwheel"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Column 2 -->
                  <div class="hero__capsule-col hero__capsule-col--offset">
                    <div class="hero__capsule-track">
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student2.svg"
                          alt="3 little girls walking the path holding hands and laughing"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student5.svg"
                          alt="girl riding a toy while smiling"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student8.svg"
                          alt="girl with bag is holding a book with a smile"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student11.svg"
                          alt="a boy is holding a bat like he is about to hit the ball"
                        />
                      </div>

                      <!-- Duplicate cards for a seamless loop -->
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student2.svg"
                          alt="3 little girls walking the path holding hands and laughing"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img

                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student8.svg"
                          alt="girl with bag is holding a book with a smile"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student11.svg"
                          alt="a boy is holding a bat like he is about to hit the ball"
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Column 3 -->
                  <div class="hero__capsule-col">
                    <div class="hero__capsule-track">
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student3.svg"
                          alt="boy is playing football"
                        />
                      </div>
                      <div class="hero__capsule-item">

                        <img

                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student12.svg"
                          alt="2 boys together looking at a microscope, one holding it and the other watching beside him"
                        />
                      </div>

                      <!-- Duplicate cards for a seamless loop -->
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student3.svg"
                          alt="boy is playing football"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student6.svg"
                          alt="girl playing golf"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student9.svg"
                          alt="girl is sitting while holding the cycle and its pedal with her other hand"
                        />
                      </div>
                      <div class="hero__capsule-item">
                        <img
                          src="./assets/student12.svg"
                          alt="2 boys together looking at a microscope, one holding it and the other watching beside him"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Enquiry form -->
          <div class="hero__form-card" id="register">
            <h2 class="hero__form-title" id="enquiry-form-heading">
              Enquire Now
            </h2>
            <form class="enquiry-form" aria-labelledby="enquiry-form-heading">
              <div class="hero__form-group">
                <label for="parent-name" class="visually-hidden"
                  >Parent's Name</label
                >
                <input
                  type="text"
                  id="parent-name"
                  name="parent-name"
                  class="hero__form-control"
                  placeholder="Parent's Name"
                  required
                />
              </div>

              <div class="hero__form-group">
                <label for="phone" class="visually-hidden">Phone number</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  class="hero__form-control"
                  placeholder="Phone number"
                  required
                />
              </div>

              <div class="hero__form-group">
                <label for="grade" class="visually-hidden"
                  >Which grade are you looking for?</label
                >
                <textarea
                  id="grade"
                  name="grade"
                  class="hero__form-control"
                  placeholder="Which grade are you looking for?"
                ></textarea>
              </div>

              <button class="submit-btn" type="submit" aria-label="Submit">
                <span class="submit-btn__content">
                  <span class="submit-btn__bg-slider"></span>
                  <span class="submit-btn__icon-box">
                    <span class="submit-btn__arrow">
                      <img src="./assets/arrow2.svg" alt="arrow" />
                    </span>
                  </span>
                  <span class="submit-btn__text">SUBMIT</span>
                </span>
              </button>
            </form>
          </div>
        </div>
      </section>
      <!-- Achievements -->
      <section class="achievements" aria-label="Achievements">
        <div class="achievements__list">
          <img src="./assets/achievement1.svg" alt="Trusted by 1 Million+" />
          <img src="./assets/achievement2.svg" alt="22+ Years of Legacy" />
          <img
            src="./assets/achievement3.svg"
            alt="500+ Participating Schools"
          />
          <img
            src="./assets/achievement4.svg"
            alt="17 Cities Across the Globe"
          />
        </div>
      </section>
      <!-- Participating schools -->
      <section
        class="participating-schools"
        aria-labelledby="participating-schools-title"
      >
        <div class="participating-schools__header">
          <h2
            class="participating-schools__title"
            id="participating-schools-title"
          >
            Participating Schools
          </h2>
          <button
            class="participating-schools__pause-btn"
            type="button"
            aria-pressed="false"
          >
            Pause
          </button>
        </div>

        <!-- Row 1: left to right -->
        <div
          class="school-slider school-slider--ltr"
          role="region"
          aria-label="Participating school logos"
          tabindex="0"
        >
          <div class="school-slider__track">
            <div class="school-card">
              <img
                src="./assets/school1.svg"
                alt="Harrow International School Bengaluru"
              />
            </div>
            <div class="school-card">
              <img
                src="./assets/school2.svg"
                alt="Shrewsbury International School Bangkok"
              />
            </div>
            <div class="school-card">
              <img
                src="./assets/school3.svg"
                alt="King's College India Rohtak"
              />
            </div>
            <div class="school-card">
              <img src="./assets/school4.svg" alt="Woodstock School 1854" />
            </div>
            <div class="school-card">
              <img
                src="./assets/school5.svg"

              />

            <div class="school-card">

            <div class="school-card">

              />
            </div>

              <img
                src="./assets/school1.svg"
                alt="Harrow International School Bengaluru"

            <div class="school-card" aria-hidden="true">

          <div class="school-slider__track">

    </main>

    <!-- Scripts deferred so they work from file:// -->
